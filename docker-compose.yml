# Local development backing services.
#
# These mirror the production topology decided in ADR 0004 so that "works locally" means
# something: PostgreSQL rather than SQLite, real Redis, and an S3-compatible object store
# standing in for Akamai Object Storage. A bug that only appears on Postgres, or an object
# written to the wrong disk, should surface on a laptop and not in staging.
#
# What is NOT here, deliberately:
#   * the API and the queue worker — they run on the host (`php artisan serve`,
#     `php artisan queue:work`). Containerising PHP would add a build step and a bind-mount
#     for no local benefit, and this repository already requires a working PHP toolchain
#     for tests and Pint. See docs/runbooks/local-development.md § Why services only.
#   * anything resembling production. Every credential below is a local-only placeholder,
#     asserted by tests/Architecture/LocalInfrastructureTest.php.
#
# Usage:  docker compose up -d --wait     (then: php artisan lguids:readiness)
# Docs:   docs/runbooks/local-development.md

name: taytay-lguids

services:
  # Stands in for Akamai Managed PostgreSQL. Pinned to the major version staging and
  # production run, so a migration cannot pass locally and fail there.
  postgres:
    image: postgres:17-alpine
    container_name: lguids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lguids}
      POSTGRES_USER: ${DB_USERNAME:-lguids}
      # Local-only. Real environments inject a secret from the platform, never a file.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lguids_local_password}
      # Match the collation behaviour of the managed service.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      # Loopback only. A local database with a known password, published on every
      # interface, is reachable from whatever network the laptop is on.
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-lguids} -d ${DB_DATABASE:-lguids}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Queues, cache, locks and rate limits. Never publicly reachable in any environment
  # (CLAUDE.md Article 8.6); locally it is bound to the host loopback only.
  redis:
    image: redis:7-alpine
    container_name: lguids-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible stand-in for Akamai Object Storage. Citizen documents and ID artifacts
  # are private objects (ADR 0004), so the bucket created below is private and no public
  # base URL is configured.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lguids-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_KEY:-lguids_local_key}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET:-lguids_local_secret}
    ports:
      - '127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the private bucket the `object-storage` disk expects, then exits.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: lguids-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${OBJECT_STORAGE_KEY:-lguids_local_key}' '${OBJECT_STORAGE_SECRET:-lguids_local_secret}' &&
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-lguids-local} &&
      mc anonymous set none local/${OBJECT_STORAGE_BUCKET:-lguids-local} &&
      echo 'bucket ready (private)'
      "
    restart: 'no'

  # Catches outbound mail so a developer never sends a real message to a resident.
  # Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: lguids-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAIL_HOST_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -q -O - http://localhost:8025/readyz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
